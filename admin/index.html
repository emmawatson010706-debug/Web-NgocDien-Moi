<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị website Ngọc Điền</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: #F5F5F0; padding: 40px 0; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 28px; padding: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .preview-img { max-width: 100%; margin-top: 10px; border-radius: 12px; }
        .success { background: #E8F5E9; padding: 10px; border-radius: 12px; margin-bottom: 20px; color: #2E7D32; }
        .audio-field { background: #F9FAFB; border: 1px solid #E5E7EB; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .audio-field label { color: #1E3A8A; font-weight: 600; margin-bottom: 8px; display: block; }
        .audio-note { font-size: 12.5px; color: #D97706; margin-top: 6px; font-style: italic; line-height: 1.5; }
        .audio-note strong { color: #DC2626; }
        select option.sub-cat { font-style: italic; color: #555; }
        
        /* CSS CHO FORM ĐĂNG NHẬP */
        .login-box { max-width: 400px; text-align: center; }
        .login-input { width: 100%; padding: 12px 15px; border: 1.5px solid #DDD5C8; border-radius: 12px; margin-bottom: 15px; font-size: 15px; box-sizing: border-box; }
        .login-input:focus { border-color: #DA251D; outline: none; }
        .btn-login { width: 100%; background: #DA251D; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background: #A01D16; }
        .btn-logout { background: #332A1E; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-logout:hover { background: #181410; }
    </style>
</head>
<body>

<div id="loginScreen" class="admin-container login-box">
    <div style="font-size: 50px; margin-bottom: 10px;">🔒</div>
    <h2 style="color:#DA251D; margin-bottom: 25px;">Đăng nhập Quản trị</h2>
    <p style="color:#666; font-size:14px; margin-bottom:20px;">Vui lòng xuất trình Thẻ từ (Tài khoản) để vào kho dữ liệu Ngọc Điền.</p>
    
    <form id="loginForm">
        <input type="email" id="adminEmail" class="login-input" placeholder="Email quản trị viên" required>
        <input type="password" id="adminPassword" class="login-input" placeholder="Mật khẩu" required>
        <button type="submit" class="btn-login" id="loginBtn">MỞ KHÓA KHO</button>
    </form>
    <div id="loginError" style="color: #DA251D; margin-top: 15px; font-size: 13.5px; font-weight: 500;"></div>
    <div style="margin-top: 30px; font-size: 13px;"><a href="../index.html" style="color:#8A7B6A;">← Quay lại Trang chủ</a></div>
</div>

<div id="mainAdmin" class="admin-container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #EAE4DC; padding-bottom: 15px; margin-bottom: 25px;">
        <h1 style="color:#DA251D; margin: 0; font-size: 24px;">📝 Quản trị xóm Ngọc Điền</h1>
        <button onclick="logoutAdmin()" class="btn-logout">🚪 Đăng xuất</button>
    </div>

    <form id="postForm">
        <label>Tiêu đề</label>
        <input type="text" id="title" required>

        <label>Danh mục</label>
        <select id="category" required>
            <option value="gioi-thieu">📄 Giới thiệu</option>
            <option value="lich-su">📜 Lịch sử</option>
            <option value="le-hoi">🎉 Lễ hội</option>
            <option value="tin-tuc">📌 Tin tức</option>
            <option value="nguoi-ngoc-dien">🌟 Người Ngọc Điền</option>
            <option value="tieng-lang">📖 Tiếng Làng (Chung)</option>
            <option value="tan-man" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ ✍️ Tản mạn</option>
            <option value="tho" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ 🌸 Thơ</option>
            <option value="am-che" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ 🍵 Bên ấm chè</option>
            <option value="giai-thoai" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ 📖 Giai thoại</option>
            <option value="kham-pha" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ 🔍 Khám phá</option>
            <option value="goc-nhin" class="sub-cat">&nbsp;&nbsp;&nbsp;↳ 💡 Góc nhìn</option>
            <option value="huong-uoc">📜 Hương ước 1883</option>
            <option value="di-tich">🏛️ Di tích</option>
            <option value="chinh-sach">⚖️ Chính sách</option>
            <option value="chuyen-doi-so">💻 Chuyển đổi số</option>
            <option value="thu-vien">📚 Thư viện</option>
            <option value="ban-do">🗺️ Bản đồ</option>
            <option value="gop-y">💬 Góp ý</option>
            <option value="podcast" style="font-weight: bold; color: #1E3A8A;">🎙️ Đọc truyện đêm khuya (Podcast)</option>
        </select>

        <label>Ảnh đại diện (chọn file ảnh)</label>
        <input type="file" id="imageFile" accept="image/*">
        <input type="text" id="imageUrl" placeholder="Hoặc dán link ảnh">
        <div id="imagePreview"></div>

        <label>Video (nhúng link YouTube)</label>
        <input type="text" id="videoUrl" placeholder="https://www.youtube.com/embed/...">

        <div class="audio-field">
            <label>🎧 Âm thanh Podcast</label>
            <input type="text" id="audioUrl" placeholder="Dán link file .mp3 (Google Drive, Soundcloud...)">
            <div class="audio-note"><strong>⚠️ LƯU Ý:</strong> Up file MP3 lên Drive/Host ngoài rồi dán link vào đây.</div>
        </div>

        <label>Nội dung chi tiết</label>
        <textarea id="content" rows="8" required></textarea>

        <label>Tác giả</label>
        <input type="text" id="author" value="Ban quản trị">

        <button type="submit" id="submitPostBtn">Đăng bài</button>
    </form>
    <div id="message"></div>
    <hr>
    <h3>📋 Bài viết trên Đám mây</h3>
    <div id="postList"></div>
    <p><a href="../index.html" target="_blank">🔗 Xem trang chủ</a> | <a href="#" onclick="exportData()">💾 Tải sao lưu</a></p>
</div>

<script src="../js/main.js"></script>
<script>
    // ==========================================
    // 1. HỆ THỐNG KIỂM TRA THẺ TỪ (LOGIN)
    // ==========================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        let email = document.getElementById('adminEmail').value;
        let password = document.getElementById('adminPassword').value;
        let btn = document.getElementById('loginBtn');
        let errorMsg = document.getElementById('loginError');
        
        btn.innerHTML = 'ĐANG XÁC THỰC...';
        btn.disabled = true;
        errorMsg.innerHTML = '';

        try {
            // Gửi yêu cầu xin cấp Thẻ từ lên Supabase
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error_description || "Sai Email hoặc Mật khẩu. Vui lòng thử lại!");
            }
            
            // Đăng nhập thành công -> Lưu thẻ từ (access_token) vào ví trình duyệt
            localStorage.setItem('supabase_admin_token', data.access_token);
            
            // Chuyển màn hình
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainAdmin').style.display = 'block';
            
            // Tải danh sách bài viết
            displayAdminPosts();
            
        } catch(err) {
            errorMsg.innerHTML = '❌ ' + err.message;
        } finally {
            btn.innerHTML = 'MỞ KHÓA KHO';
            btn.disabled = false;
        }
    });

    // Hàm kiểm tra khi vừa mở trang (có thẻ từ sẵn chưa?)
    window.onload = function() {
        if (localStorage.getItem('supabase_admin_token')) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainAdmin').style.display = 'block';
            displayAdminPosts();
        }
    };

    // Hàm đăng xuất (vứt thẻ từ đi)
    window.logoutAdmin = function() {
        localStorage.removeItem('supabase_admin_token');
        location.reload();
    };

    // Hàm lấy Thẻ từ để kẹp vào gói hàng
    function getAuthToken() {
        const token = localStorage.getItem('supabase_admin_token');
        if (!token) {
            alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại!");
            location.reload();
            return null;
        }
        return `Bearer ${token}`;
    }

    // ==========================================
    // 2. LOGIC XỬ LÝ ẢNH
    // ==========================================
    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('imageUrl').value = ev.target.result;
                document.getElementById('imagePreview').innerHTML = `<img src="${ev.target.result}" class="preview-img">`;
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 3. LOGIC ĐĂNG BÀI VÀ SỬA BÀI (Sử dụng Thẻ từ)
    // ==========================================
    document.getElementById('postForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const tokenHeader = getAuthToken();
        if (!tokenHeader) return;

        let btn = document.getElementById('submitPostBtn');
        let originalText = btn.innerHTML;
        btn.innerHTML = 'Đang đẩy lên Đám mây...';
        btn.disabled = true;

        let title = document.getElementById('title').value;
        let category = document.getElementById('category').value;
        let image = document.getElementById('imageUrl').value;
        let video = document.getElementById('videoUrl').value;
        let audioUrl = document.getElementById('audioUrl').value;
        let content = document.getElementById('content').value;
        let author = document.getElementById('author').value;
        
        let postData = { title, category, image, video, audioUrl, content, author };

        try {
            if (window.currentEditId) {
                // Sửa bài
                const response = await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${window.currentEditId}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': tokenHeader, // Kẹp thẻ từ vào đây
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(postData)
                });

                if (!response.ok) {
                    if(response.status === 401 || response.status === 403) throw new Error("Thẻ từ hết hạn hoặc bị từ chối!");
                    throw new Error("Lỗi khi cập nhật");
                }
                
                document.getElementById('message').innerHTML = '<div class="success" style="color:#FF8C00;">✅ Đã cập nhật bài viết thành công!</div>';
                window.currentEditId = null;
                btn.innerHTML = 'Đăng bài';
                btn.style.background = '#DA251D';

            } else {
                // Đăng bài mới
                postData.date = new Date().toLocaleDateString('vi-VN');
                postData.views = 0;

                const response = await fetch(`${SUPABASE_URL}/rest/v1/posts`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': tokenHeader, // Kẹp thẻ từ vào đây
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(postData)
                });

                if (!response.ok) {
                    if(response.status === 401 || response.status === 403) throw new Error("Bị Supabase từ chối (Access Denied)! Đại ca kiểm tra lại RLS nhé.");
                    throw new Error("Lỗi khi đăng bài mới");
                }
                document.getElementById('message').innerHTML = '<div class="success">✅ Đã đăng bài lên Đám mây thành công!</div>';
            }
            
            document.getElementById('postForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
            displayAdminPosts();
            
        } catch (error) {
            alert("Lỗi: " + error.message);
        } finally {
            if (!window.currentEditId) btn.innerHTML = 'Đăng bài';
            btn.disabled = false;
        }

        setTimeout(() => document.getElementById('message').innerHTML = '', 4000);
    });

    // ==========================================
    // 4. LẤY DANH SÁCH BÀI VÀ XÓA BÀI
    // ==========================================
    async function displayAdminPosts() {
        let container = document.getElementById('postList');
        container.innerHTML = '<p>Đang tải dữ liệu từ Đám mây...</p>';
        
        let posts = await fetchPostsFromSupabase(); // Hàm này chạy bằng quyền khách đọc (vẫn OK)
        
        if (posts.length === 0) { container.innerHTML = '<p>Kho Đám mây chưa có bài nào.</p>'; return; }
        
        let html = '<ul style="list-style:none; padding:0;">';
        posts.slice(0, 20).forEach(p => {
            let plainContent = p.content ? p.content.replace(/<\/?[^>]+(>|$)/g, "").substring(0,80) : "";
            html += `<li style="border-bottom:1px solid #eee; padding:15px 0; display:flex; justify-content:space-between; align-items:center;">
                <div style="flex: 1; padding-right: 15px;">
                    <strong>${p.title}</strong> <span style="color:#DA251D">(${p.category})</span> - ${p.date || ''}<br>
                    <small style="color:#666;">${plainContent}...</small>
                </div>
                <div style="min-width: 140px; text-align:right;">
                    <button type="button" onclick="editPost(${p.id})" style="background:#FF8C00; color:white; border:none; cursor:pointer; padding:8px 15px; border-radius:8px; font-size:13px; width:auto; display:inline-block; margin-right:5px;">Sửa</button>
                    <button type="button" onclick="deletePostAdmin(${p.id})" style="background:#f44336; color:white; border:none; cursor:pointer; padding:8px 15px; border-radius:8px; font-size:13px; width:auto; display:inline-block;">Xóa</button>
                </div>
            </li>`;
        });
        html += '</ul>';
        container.innerHTML = html;
    }

    window.deletePostAdmin = async function(id) {
        if (confirm('Anh có chắc chắn muốn xóa bài viết này khỏi Đám mây không? Hành động này không thể hoàn tác!')) {
            const tokenHeader = getAuthToken();
            if (!tokenHeader) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': tokenHeader // Kẹp thẻ từ vào đây
                    }
                });
                if (!response.ok) {
                    if(response.status === 401 || response.status === 403) throw new Error("Không có quyền XÓA (Access Denied)!");
                    throw new Error("Xóa thất bại");
                }
                
                alert('Đã xóa bài viết thành công!');
                displayAdminPosts(); 
            } catch (error) {
                alert("Lỗi: " + error.message);
            }
        }
    };

    function exportData() {
        let posts = getAllPosts(); 
        if(posts.length === 0) { alert("Chưa có dữ liệu để tải về."); return; }
        
        let data = JSON.stringify(posts);
        let blob = new Blob([data], {type: 'application/json'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ngocdien_backup_cloud.json';
        a.click();
    }
</script>
</body>
</html>
